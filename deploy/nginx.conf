# rePaw City — single-server deployment (nginx)
#
# Serves two React apps on separate subdomains and proxies the Laravel API:
#   repawcity.com       -> client SPA   (frontend/dist)
#   admin.repawcity.com -> admin portal (frontend/dist-admin)
#
# Both apps call the API at the relative path /api (and load images from
# /storage), so each server block proxies those to the Laravel backend
# (php artisan serve on :8000, or php-fpm behind it).
#
# Usage:
#   1. cd frontend && npm run build        # produces dist/ and dist-admin/
#   2. cd backend && php artisan migrate --force && php artisan storage:link
#   3. Point the "root" directives below at your deployment dirs.
#   4. Enable this file:  ln -s "$PWD/deploy/nginx.conf" /usr/local/etc/nginx/servers/repawcity.conf
#   5. nginx -s reload
#   (DNS must map both hostnames to this server.)

# ---- Client app (repawcity.com) ----
server {
    listen 80;
    server_name repawcity.com www.repawcity.com;

    root /var/www/repawcity/frontend/dist;
    index index.html;

    # History-mode fallback: unknown paths return index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel public disk (uploaded images) — symlink created by `php artisan storage:link`
    location /storage/ {
        alias /var/www/repawcity/backend/storage/app/public/;
    }

    # SPA build assets are content-hashed; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# ---- Admin portal (admin.repawcity.com) ----
server {
    listen 80;
    server_name admin.repawcity.com;

    root /var/www/repawcity/frontend/dist-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API (same backend)
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        alias /var/www/repawcity/backend/storage/app/public/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}