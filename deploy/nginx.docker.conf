# rePaw City web container nginx config (Docker).
#
# Serves BOTH React apps on separate subdomains and routes API + storage to
# the `backend` service:
#   repawcity.com       -> /usr/share/nginx/html       (client SPA)
#   admin.repawcity.com -> /usr/share/nginx/admin      (admin portal)
#
# Route both hostnames to this container (e.g. via the reverse proxy or
# /etc/hosts) — nginx picks the server block by Host header.
server {
    listen 80;
    server_name repawcity.com www.repawcity.com;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API -> php-fpm on the backend service (port 9000)
    location /api {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # Storage (uploaded images) served from the shared volume
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}

server {
    listen 80;
    server_name admin.repawcity.com;

    root /usr/share/nginx/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}