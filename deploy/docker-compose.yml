# rePaw City — Docker deployment
#
#   db:       MySQL 8
#   backend:  Laravel (PHP-FPM) on port 9000
#   web:      nginx serving the built SPA + routing /api + /storage to backend
#
# Quick start:
#   docker compose up -d --build
#   docker compose exec backend php artisan migrate --force
#   docker compose exec backend php artisan db:seed
#   # copy legacy uploads into the storage volume (optional)
#
# Then open http://localhost:8080

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: repawcity
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: repawcity
      DB_USERNAME: admin
      DB_PASSWORD: admin123
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - backend_storage:/var/www/backend/storage/app/public:ro
    depends_on:
      - backend

volumes:
  db_data:
  backend_storage:
